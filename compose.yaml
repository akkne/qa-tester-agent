services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: qa_agent
      POSTGRES_USER: qa_agent
      POSTGRES_PASSWORD: ${QA_POSTGRES_PASSWORD:?Set QA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${QA_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_agent -d qa_agent"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - qa-agent-postgres:/var/lib/postgresql/data

volumes:
  qa-agent-postgres: {}
