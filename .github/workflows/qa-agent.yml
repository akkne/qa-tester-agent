name: QA agent

on:
  push:
    branches: [main]
    paths-ignore:
      - "revision/**"
  workflow_dispatch:
    inputs:
      baseSha:
        description: Existing base commit SHA
        required: true
        type: string
      headSha:
        description: Commit SHA to check
        required: true
        type: string
      rerun:
        description: Start a new attempt even if this range was already checked
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  qa:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 95
    steps:
      - name: Run QA agent and publish the report
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.baseSha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.headSha || github.sha }}
          RERUN: ${{ github.event_name == 'workflow_dispatch' && inputs.rerun || false }}
          INITIAL_BASE_SHA: ${{ vars.QA_INITIAL_BASE_SHA }}
          AGENT_API_KEY: ${{ secrets.QA_AGENT_API_KEY }}
          AGENT_URL: http://127.0.0.1:5080
          WAIT_MINUTES: "90"
        shell: python3 -u {0}
        run: |
          import json, os, re, sys, time, urllib.error, urllib.request

          env = os.environ
          agent = env["AGENT_URL"]
          summary_path = env.get("GITHUB_STEP_SUMMARY")
          sha = re.compile(r"^[0-9a-fA-F]{40}$")
          zero = re.compile(r"^0+$")

          def summary(text):
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as file:
                      file.write(text + "\n")

          def fail(message):
              print(f"::error title=QA agent::{message}")
              summary(f"## ⛔ QA agent: BLOCKED\n\n{message}")
              sys.exit(1)

          def call(path, body=None, accept="application/json", attempts=5):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(agent + path, data=data, method="POST" if data else "GET",
                  headers={"X-Agent-Key": env["AGENT_API_KEY"], "Content-Type": "application/json", "Accept": accept})
              for attempt in range(attempts):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return response.read().decode("utf-8")
                  except urllib.error.HTTPError as error:
                      if error.code < 500 or attempt == attempts - 1:
                          raise RuntimeError(f"{path} returned HTTP {error.code}: {error.read().decode()[:500]}")
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as error:
                      if attempt == attempts - 1:
                          raise RuntimeError(f"QA agent at {agent} is unreachable: {error}")
                  time.sleep(3 * (attempt + 1))

          base, head = env["BASE_SHA"], env["HEAD_SHA"]
          if env["EVENT_NAME"] == "push" and zero.match(base):
              base = env.get("INITIAL_BASE_SHA", "")
          if not sha.match(base) or zero.match(base):
              fail("A real base SHA is required. Set QA_INITIAL_BASE_SHA for the first push.")
          if not sha.match(head) or zero.match(head) or head == base:
              fail("A different, real head SHA is required.")

          try:
              created = json.loads(call("/api/runs", {"repository": env["REPOSITORY"], "branch": env["BRANCH"],
                  "baseSha": base, "headSha": head, "profileId": "demo", "rerun": env["RERUN"] == "true"}))
          except RuntimeError as error:
              fail(str(error))
          run_id = created["runId"]
          page = f"{agent}/runs/{run_id}"
          print(f"Run {run_id} (attempt {created.get('attempt')}, duplicate={created['duplicate']}): {page}")

          deadline = time.time() + int(env["WAIT_MINUTES"]) * 60
          last_state = None
          while True:
              try:
                  run = json.loads(call(f"/api/runs/{run_id}"))
              except RuntimeError as error:
                  fail(f"{error}. Result page: {page}")
              if run["state"] != last_state:
                  print(f"{time.strftime('%H:%M:%S')} state: {run['state']}")
                  last_state = run["state"]
              if run["state"] == "Completed":
                  break
              if time.time() > deadline:
                  fail(f"The run did not finish within {env['WAIT_MINUTES']} minutes. Follow it at {page}")
              time.sleep(15)

          status = run.get("finalStatus") or "Unknown"
          execution = run.get("execution") or {}
          publication = run.get("publication") or {}
          analysis = run.get("analysis") or {}
          icon = {"Passed": "✅", "NeedsReview": "⚠️", "Failed": "❌"}.get(status, "⛔")
          lines = [f"## {icon} QA agent: {status.upper()}", "",
              "| | |", "| --- | --- |",
              f"| Range | `{base[:12]}..{head[:12]}` |",
              f"| Run | `{run_id}` (attempt {run.get('attempt')}) |",
              f"| Result page | {page} |",
              f"| Tests | {execution.get('totalTests') if execution.get('totalTests') is not None else 'n/a'} total, {execution.get('failedTests') if execution.get('failedTests') is not None else 'n/a'} failed |"]
          for name, check in (execution.get("checks") or {}).items():
              lines.append(f"| Check `{name}` | {'passed' if check.get('passed') else 'failed'} (exit {check.get('exitCode')}) |")
          if analysis:
              lines.append(f"| Candidate tests | {len(analysis.get('tests') or [])} |")
          if publication.get("branchUrl"):
              lines.append(f"| QA branch | [{publication.get('branch')}]({publication['branchUrl']}) |")
          if publication.get("reportUrl"):
              lines.append(f"| Report | [{publication.get('reportPath')}]({publication['reportUrl']}) |")
          if run.get("failureReason"):
              lines += ["", f"**Reason:** {run['failureReason']}"]
          for gap in analysis.get("contextGaps") or []:
              lines.append(f"- ⚠️ {gap[:600]}")
          try:
              report = call(f"/api/runs/{run_id}/report", accept="text/markdown", attempts=2)
              lines += ["", "<details><summary>Full report</summary>", "", report, "", "</details>"]
          except RuntimeError:
              pass
          summary("\n".join(lines))

          if publication.get("branchUrl"):
              print(f"QA branch: {publication['branchUrl']}")
          if status == "Passed":
              print("::notice title=QA agent::Passed")
          elif status == "NeedsReview":
              print(f"::warning title=QA agent::Repository checks passed; generated tests need review: {publication.get('reportUrl') or page}")
          elif status == "Failed":
              print(f"::error title=QA agent::Checks failed. Report: {publication.get('reportUrl') or page}")
              sys.exit(1)
          else:
              print(f"::error title=QA agent::Blocked: {run.get('failureReason')}")
              sys.exit(1)
