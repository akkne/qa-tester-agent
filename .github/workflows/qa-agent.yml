name: QA agent

on:
  push:
    branches: [main]
    paths-ignore:
      - "revision/**"
  workflow_dispatch:
    inputs:
      baseSha:
        description: Existing base commit SHA
        required: true
        type: string
      headSha:
        description: Commit SHA to check
        required: true
        type: string

permissions: {}

jobs:
  enqueue:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Send exact push range to local agent
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.baseSha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.headSha || github.sha }}
          INITIAL_BASE_SHA: ${{ vars.QA_INITIAL_BASE_SHA }}
          AGENT_API_KEY: ${{ secrets.QA_AGENT_API_KEY }}
        run: |
          if [[ "$EVENT_NAME" == "push" && "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$INITIAL_BASE_SHA"
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "A real base SHA is required. Set QA_INITIAL_BASE_SHA for the first push." >&2
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ || "$HEAD_SHA" =~ ^0+$ || "$HEAD_SHA" == "$BASE_SHA" ]]; then
            echo "A different, real head SHA is required." >&2
            exit 1
          fi
          python3 -c 'import json, os; print(json.dumps({"repository": os.environ["REPOSITORY"], "branch": os.environ["BRANCH"], "baseSha": os.environ["BASE_SHA"], "headSha": os.environ["HEAD_SHA"], "profileId": "demo"}))' \
            | curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time 30 --retry 2 \
                -H "X-Agent-Key: $AGENT_API_KEY" \
                -H "Content-Type: application/json" \
                --data-binary @- http://127.0.0.1:5080/api/runs
