services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 15
    networks: [demo]

  app:
    build:
      context: ..
      dockerfile: demo/Demo.Web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports: ["127.0.0.1:5081:8080"]
    networks: [demo]

  tests:
    build:
      context: ..
      dockerfile: demo/Demo.Tests/Dockerfile
    depends_on:
      app:
        condition: service_started
    networks: [demo]

networks:
  demo: {}
